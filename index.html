<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            background: url('background.png') no-repeat center;
            background-size: cover;
        }
        .draggable {
            position: absolute;
            cursor: grab;
            width: 100px;
            user-select: none; 
        }
        .draggable:active {
            cursor: grabbing; 
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="img/img1.png" alt="Tree" class="draggable" style="top: 100px; left: 200px;">
        <img src="img/img2.png" alt="Pinecone" class="draggable" style="top: 200px; left: 300px;">
    </div>

    <script>
        const draggables = document.querySelectorAll('.draggable');

        draggables.forEach(item => {
            let isDragging = false;

            item.addEventListener('mousedown', (e) => {
                isDragging = true; // Activa el estado de arrastre
                const offsetX = e.clientX - item.getBoundingClientRect().left;
                const offsetY = e.clientY - item.getBoundingClientRect().top;

                const moveAt = (pageX, pageY) => {
                    item.style.left = pageX - offsetX + 'px';
                    item.style.top = pageY - offsetY + 'px';
                };

                const onMouseMove = (event) => {
                    if (isDragging) {
                        moveAt(event.pageX, event.pageY);
                    }
                };

            
                document.addEventListener('mousemove', onMouseMove);

                
                document.addEventListener('mouseup', () => {
                    isDragging = false; 
                    document.removeEventListener('mousemove', onMouseMove);
                }, { once: true });
            });
        });
    </script>
</body>
</html>
